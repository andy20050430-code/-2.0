  <style>
    :root { --primary-color: #4a90e2; --bg-color: #f8f9fa; --card-bg: #ffffff; --text-main: #333; --transition: all 0.3s ease; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

    .navbar { position: fixed; top: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; }
    .nav-logo { font-weight: bold; font-size: 1.2rem; color: var(--primary-color); text-decoration: none; }
    .nav-links { display: flex; gap: 20px; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--text-main); font-weight: 500; transition: var(--transition); position: relative; padding: 5px 0; }
    .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0%; height: 2px; background-color: var(--primary-color); transition: var(--transition); }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
    .nav-links a:hover, .nav-links a.active { color: var(--primary-color); }

    .page-container { padding: 120px 20px 80px; max-width: 1100px; margin: 0 auto; min-height: 85vh; }
    .section-title { font-size: 2rem; text-align: center; margin-bottom: 30px; position: relative; }
    .section-title::after { content: ''; display: block; width: 50px; height: 4px; background: var(--primary-color); margin: 10px auto 0; border-radius: 2px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

    footer { background: #0f172a; color: #94a3b8; text-align: center; padding: 20px; font-size: 0.9rem; }
  </style>
</head>
<body>

  </nav>

    </div>

  </footer>

</body>
</html>
